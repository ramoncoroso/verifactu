name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Explicitly declare minimum required permissions (security best practice)
permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Va primero a propósito: es la única capa que compara la salida de la librería
  # con una fuente EXTERNA (los XSD y los vectores publicados por la AEAT) en vez
  # de consigo misma. Ver la issue VF-018.
  conformance:
    name: Conformidad AEAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los esquemas están congelados por hash. Si la AEAT publica una revisión,
      # este paso falla y obliga a revisar el diff en lugar de arrastrarlo en
      # silencio. No hace red: solo compara lo vendorizado con CHECKSUMS.txt.
      - name: Verificar integridad de los esquemas oficiales
        run: npm run schemas:check

      - name: Tests de conformidad
        run: npm run test:conformance

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `lint:all` y `typecheck:tests` incluyen los ficheros de test, que hasta
      # ahora no había visto ni el compilador ni el linter: `tsconfig.json` los
      # excluye —correctamente, no son entrada del build— y `lint` solo miraba
      # `src`. En esa zona ciega vivían 149 errores de tipos, y varios señalaban
      # defectos reales: tests que comparaban `undefined` con `undefined` porque
      # usaban nombres de enumerado inexistentes, y fixtures con valores que la
      # AEAT no admite. Son pasos bloqueantes a propósito.
      - name: Run ESLint (src + tests)
        run: npm run lint:all

      - name: Type check (src)
        run: npm run typecheck

      - name: Type check (tests)
        run: npm run typecheck:tests

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          # Sigue en `false` a propósito: esto solo gobierna si un fallo de SUBIDA
          # a Codecov tumba el CI, y un servicio externo caído no es un defecto
          # del código. La puerta de cobertura que sí bloquea son los umbrales de
          # `vitest.config.ts`, ajustados a la cobertura real.
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist files exist
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts

  # La única capa que valida el ARTEFACTO PUBLICADO. Todo lo demás —tests, typecheck,
  # lint— importa `src/`, así que es ciego a lo que ocurre al empaquetar: qué entra en
  # `files`, si el campo `exports` resuelve, si el build de CommonJS carga, si los
  # `.d.ts` que salen tipan. La primera vez que se ejecutó a mano encontró dos defectos
  # con la suite entera en verde.
  smoke:
    name: Humo · paquete instalado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Empaqueta, instala el tarball en un proyecto limpio y lo usa como lo usaría
      # cualquiera: ESM, CommonJS, tipos publicados y el QR decodificado por un lector
      # independiente.
      - name: Empaquetar, instalar y ejecutar
        run: npm run smoke

  # La puerta que protege a quien instala la librería. Es de ALCANCE, no de umbral:
  # "cero vulnerabilidades o falla". No hay nivel que bajar la próxima vez.
  # Ver la issue VF-032 para el razonamiento completo.
  security:
    name: Security · runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auditar el árbol de producción (tolerancia cero)
        run: npm audit --omit=dev --audit-level=low

  # Las devDependencies solo afectan a quien contribuye, no a quien consume la
  # librería. Es informativo a propósito: `semantic-release` empaqueta el CLI de
  # npm entero, cuyas vulnerabilidades no son corregibles desde este repositorio,
  # y bloquear por ellas es lo que llevó a bajar el umbral en enero (44bce0b).
  security-dev:
    name: Security · desarrollo (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auditar el árbol completo
        run: npm audit --audit-level=critical
