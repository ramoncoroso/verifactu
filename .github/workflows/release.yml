name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ SEGURO DE PUBLICACIÓN — no lo quites sin leer esto                     │
    # └────────────────────────────────────────────────────────────────────────┘
    #
    # La librería NO es conforme con la especificación de la AEAT: el QR no lo
    # decodifica ningún lector, la huella va en Base64 y el XML no valida. Ver
    # docs/AUDITORIA_CONFORMIDAD.md y las issues abiertas.
    #
    # Este workflow dispara en cada push a main. Hasta ahora no publicaba nada
    # por accidente: fallaba en `verifyConditions` por NPM_TOKEN inválido, antes
    # de analizar los commits. Eso es un atasco, no un seguro — y el ROADMAP
    # pedía configurar NPM_TOKEN, que es justo lo que lo desatascaría.
    #
    # Ahora hay dos cerrojos, y cada uno exige un acto deliberado:
    #   1. Esta condición: el job se salta salvo que exista la variable de
    #      repositorio RELEASE_ENABLED con valor 'true'.
    #   2. `npmPublish: false` en .releaserc.json.
    #
    # Ninguno de los dos se abre hasta que el job «Conformidad AEAT» de ci.yml
    # esté verde SIN tests marcados `it.fails`, y hasta que esté resuelto el
    # nombre del paquete (la issue del nombre ocupado en npm).
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      !startsWith(github.event.head_commit.message, 'chore(release)')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # El release debe pasar la misma puerta que un PR, no menos. Sin esto se
      # podría publicar una versión cuyos esquemas no coinciden con los de la AEAT.
      - name: Verificar integridad de los esquemas oficiales
        run: npm run schemas:check

      - name: Tests de conformidad
        run: npm run test:conformance

      - name: Auditoría del árbol de producción
        run: npm audit --omit=dev --audit-level=low

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f dist/index.cjs || (echo "Missing dist/index.cjs" && exit 1)
          test -f dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
